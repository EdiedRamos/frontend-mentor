<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Accesible contact form" />
    <title>Contact Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <form action="#" novalidate>
        <h1>Contact Us</h1>
        <div>
          <label for="first-name-input"
            >First Name <span aria-hidden="true">*</span></label
          >
          <input
            type="text"
            name="first-name"
            id="first-name-input"
            required
            aria-describedby="first-name-error"
            aria-invalid="false"
            autocomplete="name"
            pattern="\s*\S.*"
          />
          <span
            id="first-name-error"
            class="form__field--required"
            aria-live="polite"
            >This field is required</span
          >
        </div>
        <div>
          <label for="last-name-input"
            >Last Name <span aria-hidden="true">*</span></label
          >
          <input
            type="text"
            name="last-name"
            id="last-name-input"
            required
            aria-describedby="last-name-error"
            aria-invalid="false"
            pattern="\s*\S.*"
          />
          <span
            id="last-name-error"
            class="form__field--required"
            aria-live="polite"
            >This field is required</span
          >
        </div>
        <div>
          <label for="email-input"
            >Email Address <span aria-hidden="true">*</span></label
          >
          <input
            type="email"
            name="email"
            id="email-input"
            required
            aria-describedby="email-error"
            aria-invalid="false"
          />
          <span
            id="email-error"
            class="form__field--required"
            aria-live="polite"
            >This field is required</span
          >
        </div>
        <div>
          <fieldset>
            <legend>Query Type <span aria-hidden="true">*</span></legend>
            <div>
              <label>
                <input
                  type="radio"
                  name="query-type"
                  id="general-enquiry"
                  value="General Enquiry"
                  required
                  aria-describedby="query-type-error"
                  aria-invalid="false"
                />
                <span>General Enquiry</span>
              </label>
              <label>
                <input
                  type="radio"
                  name="query-type"
                  id="support-request"
                  value="Support Request"
                  required
                  aria-describedby="query-type-error"
                  aria-invalid="false"
                />
                <span>Support Request</span>
              </label>
            </div>
            <span
              id="query-type-error"
              class="form__field--required"
              aria-live="polite"
              >This field is required</span
            >
          </fieldset>
        </div>
        <div>
          <label for="message-input"
            >Message <span aria-hidden="true">*</span></label
          >
          <textarea
            name="message"
            id="message-input"
            aria-describedby="message-error"
            aria-invalid="false"
            required
          ></textarea>
          <span
            id="message-error"
            class="form__field--required"
            aria-live="polite"
            >This field is required</span
          >
        </div>
        <div>
          <div>
            <input
              type="checkbox"
              name="contact-consent"
              id="contact-consent-input"
              required
              aria-describedby="contact-consent-error"
              aria-invalid="false"
            />
            <label for="contact-consent-input"
              >I consent to being contacted by the team
              <span aria-hidden="true">*</span></label
            >
          </div>
          <span
            id="contact-consent-error"
            class="form__field--required"
            aria-live="polite"
            >To submit this form, please consent to being contacted</span
          >
        </div>
        <div>
          <button type="submit">Submit</button>
        </div>
      </form>
      <div id="success-alert" role="alert" aria-hidden="true">
        <strong>Message Sent!</strong>
        <p>Thanks for completing the form. We'll be in touch soon!</p>
      </div>
    </main>
  </body>
</html>
